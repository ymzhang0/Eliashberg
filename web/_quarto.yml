project:
  type: book

book:
  title: "Eliashberg.jl Documentation"
  author: "Yiming Zhang"
  chapters:
    - index.qmd
    - part: "Getting Started"
      chapters: []
    - part: "Physics Foundations (Theory)"
      chapters:
        - content/physics/intro.ipynb
        - content/physics/electron_phonon.ipynb
    - part: "Examples"
      chapters:
        - content/examples/plasmon.qmd
    - part: "Applications & Workflows"
      chapters:
        - content/applications/RPA.ipynb
        - content/applications/BCS.ipynb
    - part: "HPC & Architecture"
      chapters:
        - content/hpc/cluster_workflows.qmd
    - part: "API Reference"
      chapters:
        - content/api/parameters.qmd
        - content/api/data_types.qmd
        - content/api/appendix.ipynb
format:
  html:
    theme: flatly
    css: styles/eliashberg-ojs.css
    include-in-header: includes/mathjax-numbering.html
    toc: true
    number-sections: true
    code-fold: true
