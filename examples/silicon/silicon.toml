[system]
n_workers = 31             # 集群上留 1 个核给主进程，剩下全做 worker
bootstrap_workers = true   # 允许引擎自动初始化这些 workers
output_dir = "examples/silicon/results"
job_name = "silicon"
output_filename = "silicon"
write_hdf5 = true
write_jld2 = true
backup_config = true
log_filename = "runner.log"
log_level = "info"
quiet = false

[geometry]
type = "from_qe_xml"
xml = "./Si.xml"

[kpoints]
grid = [20, 20, 20]

[model]
type = "from_wannier90"
tb_dat = "./silicon_tb.dat"
EF = -0.5
spinor = false

[interaction]
type = "BareCoulomb"
cutoff = 0.001

[field]
type = "DirectChannel"

[task]
type = "spectral_function"
npoints_each_line = 1000
omega_range = [0.0, 5.0]
omega_points = 1000
T = 0.01
eta = 0.02

[plot]
enable = false
save_path = "output/rpa_scan_result"
