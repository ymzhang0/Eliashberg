[system]
n_workers = 31             # 集群上留 1 个核给主进程，剩下全做 worker
bootstrap_workers = true   # 允许引擎自动初始化这些 workers
output_dir = "examples/plasmon/out"
job_name = "plasmon_2d"
output_filename = "plasmon_scan"
write_hdf5 = true
write_jld2 = true
backup_config = true
log_filename = "runner.log"
log_level = "info"
quiet = false

[geometry]
type = "SquareLattice"
a = 1.5

[kpoints]
grid = [50, 50]

[model]
type = "TightBinding"
t = -1.0
tp = 0.2                   # 次近邻跃迁
EF = -0.5
use_spinor = false

[interaction]
type = "BareCoulomb"
cutoff = 0.01

[field]
type = "DirectChannel"

[task]
type = "scan_spectral_function"
qpath_points = [[0.0, 0.0], [2.0943951, 0.0], [2.0943951, 2.0943951], [0.0, 0.0]]
qpath_labels = ["Γ", "X", "M", "Γ"]
npoints_each_line = 100
omega_range = [0.0, 5.0]
omega_points = 400
T_val = 0.01
eta = 0.02

[plot]
enable = false
save_path = "output/rpa_scan_result"
