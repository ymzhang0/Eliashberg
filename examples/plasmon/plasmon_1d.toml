[system]
n_workers = 1             # 集群上留 1 个核给主进程，剩下全做 worker
bootstrap_workers = true   # 允许引擎自动初始化这些 workers
output_dir = "examples/plasmon/results"
job_name = "plasmon_1d"
output_filename = "plasmon_scan"
write_hdf5 = true
write_jld2 = true
backup_config = true
log_filename = "runner.log"
log_level = "info"
quiet = false

[geometry]
type = "Predefined"
name = "atomic_chain"
a = 1.5
element = "C"

[kpoints]
grid = [100]

[model]
type = "TightBinding"
t = 1.0
EF = -0.3
spinor = false

[interaction]
type = "BareCoulomb"
cutoff = 0.001

[field]
type = "DirectChannel"

[task]
type = "spectral_function"
npoints_each_line = 2000
omega_range = [0.0, 5.0]
omega_points = 2000
T = 0.01
eta = 0.02

[plot]
enable = true
